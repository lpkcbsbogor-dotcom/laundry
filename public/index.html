<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Operasional Laundry</title>
    <!-- Menggunakan Tailwind CSS untuk styling cepat -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-blue-600 mb-6 text-center">Dashboard Operasional Laundry 🧺</h1>

        <!-- Form Tambah Pesanan -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Tambah Pesanan Baru</h2>
            <form id="orderForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Nama Pelanggan</label>
                    <input type="text" id="customerName" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Jenis Layanan</label>
                    <select id="serviceType" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="Cuci Kering">Cuci Kering</option>
                        <option value="Cuci Setrika">Cuci Setrika</option>
                        <option value="Setrika Saja">Setrika Saja</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Berat (Kg)</label>
                    <input type="number" step="0.1" id="weightKg" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Total Harga (Rp)</label>
                    <input type="number" id="totalHarga" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="md:col-span-2">
                    <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition">Simpan Pesanan</button>
                </div>
            </form>
        </div>

        <!-- Daftar Pesanan -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Daftar Pesanan Masuk</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-200 text-gray-600 text-sm">
                            <th class="p-3">Pelanggan</th>
                            <th class="p-3">Layanan</th>
                            <th class="p-3">Berat</th>
                            <th class="p-3">Harga</th>
                            <th class="p-3">Status</th>
                        </tr>
                    </thead>
                    <tbody id="orderTableBody" class="text-gray-700 text-sm">
                        <!-- Data akan dimasukkan lewat JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/orders';

        // Fungsi Ambil Data Pesanan
        async function fetchOrders() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                const tbody = document.getElementById('orderTableBody');
                tbody.innerHTML = '';

                if (result.success && result.data.length > 0) {
                    result.data.forEach(order => {
                        const tr = document.createElement('tr');
                        tr.className = 'border-b hover:bg-gray-50';
                        tr.innerHTML = `
                            <td class="p-3 font-medium">${order.customerName}</td>
                            <td class="p-3">${order.serviceType}</td>
                            <td class="p-3">${order.weightKg} Kg</td>
                            <td class="p-3">Rp ${Number(order.totalHarga).toLocaleString('id-ID')}</td>
                            <td class="p-3"><span class="bg-yellow-100 text-yellow-800 text-xs px-2 py-1 rounded-full font-semibold">${order.status}</span></td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">Belum ada pesanan laundry.</td></tr>`;
                }
            } catch (error) {
                console.error('Gagal memuat data:', error);
            }
        }

        // Fungsi Tambah Pesanan
        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const customerName = document.getElementById('customerName').value;
            const serviceType = document.getElementById('serviceType').value;
            const weightKg = parseFloat(document.getElementById('weightKg').value);
            const totalHarga = parseFloat(document.getElementById('totalHarga').value);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ customerName, serviceType, weightKg, totalHarga })
                });
                const result = await response.json();
                if (result.success) {
                    document.getElementById('orderForm').reset();
                    fetchOrders(); // Refresh tabel
                } else {
                    alert('Gagal menyimpan pesanan: ' + result.error);
                }
            } catch (error) {
                console.error('Error:', error);
            }
        });

        // Load data saat halaman dibuka
        fetchOrders();
    </script>
</body>
</html>
